<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body{
        font-family: Arial;
        margin: 0px;
        margin-bottom: 0px;

      }
      .send-button{
        background-color: rgb(25, 135, 84);
        color: white;
        padding: 12px 20px;
        border-radius: 10%;
        margin: 10px;
        border: none;
        font-size: 15px;
        cursor: pointer;
      }

      .chat-input {
        padding: 12px 15px ;
        border-radius: 10px;
        border-width: 1px;
        font-size: 15px;
        flex-grow: 1;
      }

      .chat-input-container{
        display: flex;
        margin-bottom: 60px ;
      }

      .app-container{
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .chat-message-user{
        display: flex;
        justify-content: end;
        align-items: start;
       
      }

      .chat-message-text{
        background-color: rgb(238,238 ,238);
        padding: 15px 20px;
        border-radius: 10px;
        margin-right: 10px;
        margin-left: 10px;
        margin-bottom: 20px;
        margin-top: 5px;
        max-width: 300px;
      }

      .chat-message-robot{
        display: flex;
        align-items:start;
      }
      .chat-message-profile{
        width: 45px;

      }

      .chat-messages-container{
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
        
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
     function ChatInput({chatMessages,setChatMessages}){
      const[inputText,setInputText]= React.useState('')
       
      function saveInputText(event){
    setInputText(event.target.value);
      }
      function sendMessage(event){
        const newChatMessages =[
          ...chatMessages,
          {
            message:inputText,
            sender:'user',
            id: crypto.randomUUID()
          }
       ];
        setChatMessages(newChatMessages);

       const response = Chatbot.getResponse(inputText);
          setChatMessages([
          ...newChatMessages,
          {
            message:response,
            sender:'robot',
            id: crypto.randomUUID()
          }
       ]);


       setInputText('')
      }
      return(
        <div className='chat-input-container'>
          <input
            placeholder="Send a message  to Chatbot"
            size="30"
            onChange={saveInputText}
            value={inputText}
            className='chat-input'
          />
          <button
            onClick={sendMessage}
            className='send-button'
             >send
          </button>
          </div>
       );
      }
      function ChatMessage({message,sender}){
    
      return(
        <div className={sender ===
          'user'
           ? 'chat-message-user' : 
             'chat-message-robot'
        }>
        {sender === 'robot' && (
          <img src= "https://cdn-icons-png.flaticon.com/512/4712/4712027.png"
               className='chat-message-profile'
          />
        )}
       <div className='chat-message-text'>
         {message}
       </div>
        {sender === 'user'   &&   (
          <img src="https://cdn-icons-png.flaticon.com/512/1077/1077012.png" className='chat-message-profile' 
              
          />
        )}
        </div>
      );
     }
     // (مرحله دوم خلاصه کردن فقط کافیه message,sender داخل {}بنویسیم )
    // const message=props.message;
    //  const sender=props.sender;
    // (مرحله اول خلاصه کردن)برای کوتاه تر شدن دو خط کد بالا  فقط یک خط کد زیر رو مینویسی
    //const { message,sender}=props;
      /* if(sender === 'robot'){
       return(
          <div>
        <img src="robot.png" width="50"/>
        {message}
        </div>
  
       );
       بجای ifاز && استفاده کردیم که خیلی کوتاه تر شد کدمون
     */ 
     function ChatMessages({
      chatMessages}) {
        const chatMessagesRef = React.useRef
        (null);

        React.useEffect( ()=>{
          console.log( chatMessagesRef.
            current);
        },[chatMessages]
        );
        return(
          <div className='chat-messages-container'
           ref={chatMessagesRef}>
           {chatMessages.map((chatmessage)=> {
            return(
            <ChatMessage
                message={chatmessage.message}
                sender={chatmessage.sender}
                key={chatmessage.id}
            />
          );
        })}
       </div>
      );
     }
     
    /*📦 نتیجه نهایی:

بعد از اجرای کد، chatMessageComponents می‌شه یک لیست جدید که توش این چیزها هست:

const chatMessageComponents = [
  <ChatMessage message="hello Chatbot" sender="user" />,
  <ChatMessage message="Hello! How can I help you?" sender="robot" />,
  <ChatMessage message="can you get me today data" sender="user" />,
  <ChatMessage message="Today is November 14" sender="robot" />
];

❓ چرا این کار رو می‌کنی?

چون اگر بخوای پیام جدید اضافه کنی، فقط کافیه به chatMessages اضافه کنی:

// اضافه کردن پیام جدید
chatMessages.push({
  message: "ممنون از کمکت",
  sender: "user"
});
و دیگه لازم نیست دستی بری و <ChatMessage> جدید بنویسی! خودش اتوماتیک ساخته می‌شه.*/
      function App(){
         const [chatMessages,setChatMessages]= React.useState([{ 
          message:"hello Chatbot",
          sender:"user",
          id:'id1'
      },
      {
          message:"Hello! How can I help you?", 
          sender:"robot",
          id:'id2'
      },
      {
          message:"can you get me today data", 
          sender:"user",
          id:'id3'
      },
      {
          message:"Today is November 14", 
          sender:"robot",
          id:'id4'
      }]);
      //const [chatMessages,setChatMessages]=array;
       //const chatMessages = array[0];
       //const setChatMessages = array[1];
        return(
          <div className='app-container'>
            
            
            <ChatMessages
            chatMessages={chatMessages}
            />
              <ChatInput 
            chatMessages={chatMessages}
            setChatMessages={setChatMessages}
           />
          </div>
        );
      }
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
